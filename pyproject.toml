[project]
name = "funread-api"
version = "1.1.104"
description = "funread 采集源管理后端服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # [reader] pulls in lxml/cssselect/jsonpath-ng — the rule engine needs them,
    # the collection pipeline does not.
    # 下界必须 >=1.1.104: `reader` extra 是 1.1.104 才有的。1.1.103 上
    # `funread[reader]` 不报错, 只是解析成「没有额外依赖」—— lxml 静默缺席,
    # 规则引擎在 import 时才炸。
    "funread[reader]>=1.1.104",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "requests>=2.28.0",
    # 读者账号（注册/登录/邀请码/角色）整套走 funauth。它要求 py3.12 + SQLAlchemy
    # async，这也是账号表建在本服务而不是 funread 核心库里的原因 —— 后者下限是
    # 3.10，不该为了账号功能抬高只用采集的人的 Python 下限。
    "funauth[fastapi]>=0.2.2",
    # funauth 是纯 async 的，而本服务其余部分同步。两个 driver 都要装：账号表走
    # async 引擎，阅读层继续走 funread 的同步引擎，同一个库两个连接。
    "aiosqlite>=0.20.0",
    "aiomysql>=0.2.0",
    # Starlette 的 SessionMiddleware 签 cookie 用它，不是 starlette 的硬依赖。
    "itsdangerous>=2.1.0",
]
license = "MIT"

[project.scripts]
funread-api = "funread_api.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "httpx>=0.27.0", "httpx2>=0.1.0", "ruff>=0.1.0"]

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funread-api"
Releases = "https://github.com/farfarfun/funread-api/releases"

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.funbuild]
# 发版时把 funread 的版本下界抬到最新 —— pip 默认 only-if-needed，下界不动的话
# 已装的旧 funread 不会被升上来，而这个服务的规则引擎就跟着旧。
# 用 latest-packages 而不是 funbuild.toml 的 packages：后者走 uv remove + uv add，
# 会把上面那个 [reader] extra 丢掉。
latest-packages = ["funread"]

[tool.hatch.build.targets.wheel]
packages = ["src/funread_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# funread is the sibling workspace package, not a third-party dependency. Ruff
# only sees it installed into site-packages and would otherwise split it away
# from funread_api, which is how the import blocks are actually written.
known-first-party = ["funread", "funread_api"]
