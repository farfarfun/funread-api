[project]
name = "funread-api"
version = "0.1.0"
description = "funread 采集源管理后端服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "funread>=1.1.101",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "requests>=2.28.0",
]
license = "MIT"

[project.scripts]
funread-api = "funread_api.app:run"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "httpx>=0.27.0", "ruff>=0.1.0"]

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funread-api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funread_api"]

[tool.uv.sources]
funread = { path = "../funread", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
